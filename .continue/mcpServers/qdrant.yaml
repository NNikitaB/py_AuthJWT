name: Qdrant MCP
version: 0.0.1
schema: v1
mcpServers:
  - name: Qdrant MCP
    command: uvx
    args:
      - "mcp-server-qdrant"
    env:
      QDRANT_URL: "${{ secrets.QDRANT_URL }}:${{ secrets.QDRANT_PORT }}"
      QDRANT_API_KEY: "${{ secrets.QDRANT_API_KEY }}"
      COLLECTION_NAME: "${{ secrets.QDRANT_COLLECTION_NAME }}"